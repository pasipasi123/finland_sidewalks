name: Publish dashboard
on:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/validate-web-data.mjs', 'tests/web.test.mjs', '.github/workflows/pages.yml', 'package.json']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test table behaviour
        run: |
          node --check web/app.js
          npm test
      - name: Check nationwide data completeness
        run: npm run check:data
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
